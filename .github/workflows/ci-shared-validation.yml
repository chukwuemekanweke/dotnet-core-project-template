# DEVOPS-012: thin callers of the shared devops-toolkit workflows.
# PR 1: shared .NET CI + parity check against ci.yml (runs on every event).
# PR 2: release image publishing through docker-publish.yml, only on push to main after
#       verification, tagged release-<sha> so it cannot collide with ci.yml's legacy
#       :latest/:<sha> tags. ci.yml's verification and publishing jobs are retired in a
#       follow-up once this path has published and verified a release on main.
# This workflow never deploys.
name: CI shared validation (.NET 10)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-shared-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-ci:
    name: Shared .NET CI
    permissions:
      contents: read
    # Pinned to a reviewed full commit SHA: devops-toolkit has no published release tag yet.
    # 1891bbf = devops-toolkit main after the masked-output fixes (#13 docker-publish, #14 vps-deploy).
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/dotnet-ci.yml@1891bbfc7694eb20233cda1bdd1f511319b54959
    with:
      solution-path: BackendProjectTemplate.slnx
      dotnet-version: 10.0.x
      build-configuration: Release
      run-format: true
      format-diagnostics: IDE0005
      run-unit-tests: true
      unit-test-projects: tests/unit/**/*.UnitTests.csproj
      run-integration-tests: true
      integration-test-projects: tests/integration/**/*.IntegrationTests.csproj
      fail-on-empty-test-set: true
      collect-coverage: true
      upload-test-artifacts: true
    secrets:
      # Read-only GitHub Packages credentials for the Mailtrap feed in nuget.config.
      # GitHub withholds secrets from fork pull requests, so fork restores fail exactly as in ci.yml.
      nuget-username: ${{ secrets.GH_PKG_USERNAME }}
      nuget-token: ${{ secrets.GH_PKG_PAT }}

  parity-check:
    name: Parity check against legacy CI discovery
    needs: shared-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require shared CI outputs
        env:
          VERIFICATION_PASSED: ${{ needs.shared-ci.outputs.verification-passed }}
          TEST_RESULTS_ARTIFACT: ${{ needs.shared-ci.outputs.test-results-artifact }}
          COVERAGE_ARTIFACT: ${{ needs.shared-ci.outputs.coverage-artifact }}
        run: |
          echo "verification-passed=$VERIFICATION_PASSED"
          echo "test-results-artifact=$TEST_RESULTS_ARTIFACT"
          echo "coverage-artifact=$COVERAGE_ARTIFACT"
          test "$VERIFICATION_PASSED" = "true"
          test -n "$TEST_RESULTS_ARTIFACT"
          test -n "$COVERAGE_ARTIFACT"

      - name: Download combined test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.shared-ci.outputs.test-results-artifact }}
          path: ${{ runner.temp }}/parity/test-results

      - name: Download combined coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.shared-ci.outputs.coverage-artifact }}
          path: ${{ runner.temp }}/parity/coverage

      - name: Verify test project set, executed tests and coverage
        run: >-
          python3 .github/scripts/verify-shared-ci-artifacts.py
          --repo "$GITHUB_WORKSPACE"
          --test-results "$RUNNER_TEMP/parity/test-results"
          --coverage "$RUNNER_TEMP/parity/coverage"

  image-config:
    name: Validate release image configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify .github/docker-images.json
        run: python3 .github/scripts/verify-release-images.py config

  publish-images:
    name: Publish release images
    needs: [shared-ci, parity-check, image-config]
    # Trusted path only: never publish from pull requests or manual dispatch on other refs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    # Same reviewed toolkit revision as shared-ci.
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/docker-publish.yml@1891bbfc7694eb20233cda1bdd1f511319b54959
    with:
      # Write-once release identity: the toolkit tags release-<sha> and refuses existing tags.
      deployment-id: ${{ github.sha }}
      image-config-path: .github/docker-images.json
      # All four Dockerfiles restore Mailtrap from GitHub Packages via BuildKit secrets.
      package-auth-components: |
        webapi
        consumer
        jobs
        migrator
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
      github-packages-username: ${{ secrets.GH_PKG_USERNAME }}
      github-packages-token: ${{ secrets.GH_PKG_PAT }}

  verify-release:
    name: Verify published release manifest and digests
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.publish-images.outputs.manifest-artifact }}
          path: ${{ runner.temp }}/release

      - name: Check manifest output matches the canonical artifact
        env:
          MANIFEST_JSON: ${{ needs.publish-images.outputs.manifest-json }}
          DEPLOYMENT_ID: ${{ needs.publish-images.outputs.deployment-id }}
        run: |
          test "$DEPLOYMENT_ID" = "$GITHUB_SHA"
          diff <(jq -S . "$RUNNER_TEMP/release/deployment-manifest.json") <(jq -S . <<< "$MANIFEST_JSON")

      - name: Check manifest against image configuration
        run: >-
          python3 .github/scripts/verify-release-images.py manifest
          --manifest "$RUNNER_TEMP/release/deployment-manifest.json"
          --deployment-id "$GITHUB_SHA"
          --source-commit "$GITHUB_SHA"
          > "$RUNNER_TEMP/release/references.txt"

      - name: Resolve every digest in the registry
        run: |
          while read -r reference; do
            echo "Resolving $reference"
            docker buildx imagetools inspect "$reference" > /dev/null
          done < "$RUNNER_TEMP/release/references.txt"
          test "$(wc -l < "$RUNNER_TEMP/release/references.txt")" -eq 4

      - name: Summarize release
        run: |
          {
            echo "### Release ${GITHUB_SHA}"
            echo
            echo "| Component | Immutable reference |"
            echo "|---|---|"
            jq -r '.components[] | "| \(.name) | `\(.image)@\(.digest)` |"' "$RUNNER_TEMP/release/deployment-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
