# CI/CD: thin callers of the shared devops-toolkit reusable workflows (DEVOPS-012).
# Every event: shared .NET CI (format, Release build, unit + Testcontainers integration
# tests, TRX, coverage) and image-config validation.
# Push to main only: publish release-<sha> images and verify the immutable manifest.
# This workflow never deploys.
name: CI/CD (.NET 10)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-ci:
    name: Shared .NET CI
    permissions:
      contents: read
    # Pinned to a reviewed full commit SHA: devops-toolkit has no published release tag yet.
    # 1891bbf = devops-toolkit main after the masked-output fixes (#13 docker-publish, #14 vps-deploy).
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/dotnet-ci.yml@1891bbfc7694eb20233cda1bdd1f511319b54959
    with:
      solution-path: BackendProjectTemplate.slnx
      dotnet-version: 10.0.x
      build-configuration: Release
      run-format: true
      format-diagnostics: IDE0005
      run-unit-tests: true
      unit-test-projects: tests/unit/**/*.UnitTests.csproj
      run-integration-tests: true
      integration-test-projects: tests/integration/**/*.IntegrationTests.csproj
      fail-on-empty-test-set: true
      collect-coverage: true
      upload-test-artifacts: true
    secrets:
      # Read-only GitHub Packages credentials for the Mailtrap feed in nuget.config.
      # GitHub withholds secrets from fork pull requests, so fork restores fail.
      nuget-username: ${{ secrets.GH_PKG_USERNAME }}
      nuget-token: ${{ secrets.GH_PKG_PAT }}

  image-config:
    name: Validate release and deploy configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify .github/docker-images.json
        run: python3 .github/scripts/verify-release-images.py config

      - name: Render production Compose with fixture host values
        # Placeholder stack.env values and digests only prove the file renders; at deploy time the
        # host supplies stack.env and the toolkit injects the release manifest digests.
        env:
          RUNTIME_SECRETS_APPLICATION: backendprojecttemplate
          RUNTIME_SECRETS_ENVIRONMENT: prd
          WEBAPI_SECRETS_GID: "1"
          CONSUMER_SECRETS_GID: "1"
          JOBS_SECRETS_GID: "1"
          DATABASE_MIGRATOR_SECRETS_GID: "1"
        run: |
          jq --arg digest "sha256:$(printf '0%.0s' {1..64})" \
            '{services: (.images | map({key: (if .component == "migrator" then "database-migrator" else .component end),
              value: {image: "\(.image)@\($digest)"}}) | from_entries)}' \
            .github/docker-images.json > "$RUNNER_TEMP/images.fixture.json"
          docker compose -f deploy/compose.production.yml -f "$RUNNER_TEMP/images.fixture.json" \
            --profile '*' config --format json > "$RUNNER_TEMP/compose.production.json"

      - name: Verify deployment configuration consistency
        run: |
          yq -o=json '.jobs.deploy-production.with' .github/workflows/ci.yml > "$RUNNER_TEMP/deploy-inputs.json"
          python3 .github/scripts/verify-release-images.py deploy \
            --compose-json "$RUNNER_TEMP/compose.production.json" \
            --deploy-json "$RUNNER_TEMP/deploy-inputs.json"

  publish-images:
    name: Publish release images
    needs: [shared-ci, image-config]
    # Trusted path only: never publish from pull requests or manual dispatch on other refs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    # Same reviewed toolkit revision as shared-ci.
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/docker-publish.yml@1891bbfc7694eb20233cda1bdd1f511319b54959
    with:
      # Write-once release identity: the toolkit tags release-<sha> and refuses existing tags.
      deployment-id: ${{ github.sha }}
      image-config-path: .github/docker-images.json
      # All four Dockerfiles restore Mailtrap from GitHub Packages via BuildKit secrets.
      package-auth-components: |
        webapi
        consumer
        jobs
        migrator
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
      github-packages-username: ${{ secrets.GH_PKG_USERNAME }}
      github-packages-token: ${{ secrets.GH_PKG_PAT }}

  verify-release:
    name: Verify published release manifest and digests
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.publish-images.outputs.manifest-artifact }}
          path: ${{ runner.temp }}/release

      - name: Check manifest output matches the canonical artifact
        env:
          MANIFEST_JSON: ${{ needs.publish-images.outputs.manifest-json }}
          DEPLOYMENT_ID: ${{ needs.publish-images.outputs.deployment-id }}
        run: |
          test "$DEPLOYMENT_ID" = "$GITHUB_SHA"
          diff <(jq -S . "$RUNNER_TEMP/release/deployment-manifest.json") <(jq -S . <<< "$MANIFEST_JSON")

      - name: Check manifest against image configuration
        run: >-
          python3 .github/scripts/verify-release-images.py manifest
          --manifest "$RUNNER_TEMP/release/deployment-manifest.json"
          --deployment-id "$GITHUB_SHA"
          --source-commit "$GITHUB_SHA"
          > "$RUNNER_TEMP/release/references.txt"

      - name: Resolve every digest in the registry
        run: |
          while read -r reference; do
            echo "Resolving $reference"
            docker buildx imagetools inspect "$reference" > /dev/null
          done < "$RUNNER_TEMP/release/references.txt"
          test "$(wc -l < "$RUNNER_TEMP/release/references.txt")" -eq 4

      - name: Summarize release
        run: |
          {
            echo "### Release ${GITHUB_SHA}"
            echo
            echo "| Component | Immutable reference |"
            echo "|---|---|"
            jq -r '.components[] | "| \(.name) | `\(.image)@\(.digest)` |"' "$RUNNER_TEMP/release/deployment-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to production VPS
    needs: [publish-images, verify-release]
    # Off until an operator sets the repository variable PRODUCTION_DEPLOY_ENABLED=true after the
    # readiness gates in docs/ci-cd.md pass. The toolkit job also runs in the protected "production"
    # GitHub Environment, so its required reviewers and branch rules apply on top of this.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    # Same reviewed toolkit revision as shared-ci and publish-images.
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/vps-deploy.yml@1891bbfc7694eb20233cda1bdd1f511319b54959
    with:
      environment: production
      deployment-id: ${{ needs.publish-images.outputs.deployment-id }}
      # The canonical same-run manifest artifact that verify-release checked.
      manifest-artifact: ${{ needs.publish-images.outputs.manifest-artifact }}
      compose-files: deploy/compose.production.yml
      stack-name: backendprojecttemplate-production
      component-service-map: '{"migrator":"database-migrator"}'
      remote-deployment-path: /srv/backendprojecttemplate/production
      migration-service: database-migrator
      migration-timeout-seconds: 900
      health-services: |
        webapi
        consumer
        jobs
      health-checks: '[{"name":"webapi","url":"http://127.0.0.1:8080/health"}]'
      health-timeout-seconds: 300
      rollback-on-health-failure: true
    secrets:
      # Secrets of the protected "production" GitHub Environment, read when the toolkit's
      # environment-scoped job starts. Registry credentials are pull-only.
      ssh-host: ${{ secrets.VPS_HOST }}
      ssh-user: ${{ secrets.VPS_DEPLOY_USER }}
      ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
      ssh-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      registry-username: ${{ secrets.DOCKERHUB_READ_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_READ_TOKEN }}

  notify-deployment-failure:
    name: Alert on failed production deployment
    needs: deploy-production
    if: >-
      always() &&
      (needs.deploy-production.result == 'failure' || needs.deploy-production.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send sanitized deployment alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          STACK: backendprojecttemplate-production
          DEPLOYMENT_ID: ${{ github.sha }}
          OUTCOME: ${{ needs.deploy-production.outputs.deployment-outcome || 'unknown' }}
          FAILED_PHASE: ${{ needs.deploy-production.outputs.failed-phase || 'unknown' }}
          MIGRATION_STATUS: ${{ needs.deploy-production.outputs.migration-status || 'unknown' }}
          RESTORATION: ${{ needs.deploy-production.outputs.restoration-outcome || 'unknown' }}
          RECORD: ${{ needs.deploy-production.outputs.deployment-record-artifact || 'none' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$ALERT_WEBHOOK_URL" || { echo "DEPLOY_ALERT_WEBHOOK_URL is not configured; no alert was delivered" >&2; exit 1; }
          jq -n --arg stack "$STACK" --arg id "$DEPLOYMENT_ID" --arg outcome "$OUTCOME" --arg phase "$FAILED_PHASE" \
            --arg migration "$MIGRATION_STATUS" --arg restoration "$RESTORATION" --arg record "$RECORD" --arg run "$RUN_URL" \
            '{text: "Production deployment of \($stack) failed (\($outcome)). release=\($id) phase=\($phase) migration=\($migration) restoration=\($restoration) record=\($record) \($run)"}' \
            | curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' --data @- "$ALERT_WEBHOOK_URL"
