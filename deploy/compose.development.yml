# Development-environment Compose for the four release components, deployed by devops-toolkit vps-deploy.yml
# as stack backendprojecttemplate-development. Same contract as compose.production.yml (digest-injected images,
# no builds, per-service runtime secrets, one-shot migrator, non-root, read-only roots, restart "no"), with these
# development-host differences:
#
# - .NET environment: the hosts run as Production on purpose. Only Production loads the file-delivered secrets at
#   /run/secrets/app (AddProductionSecrets); Development would ignore the Doppler-rendered generation and fall back
#   to Development JSON. "development" is the deployment environment (GitHub Environment, stack, Doppler dev_*).
# - WebAPI publishes on 127.0.0.1:8090 because the co-hosted pickly stack already owns 127.0.0.1:8080.
# - PostgreSQL is the existing pickly-postgres-1 container, reached over the pre-created internal Docker network
#   "shared-postgres" (alias "postgres"). The host registry allows only that external network.
# - The app network has a pinned subnet; WebAPI trusts forwarded headers only from its gateway.
# - Telemetry goes to the OTLP endpoint/protocol in the host stack.env (Grafana Cloud's OTLP gateway); export is off
#   when it is unset. The auth header is the optional OTEL_EXPORTER_OTLP_HEADERS runtime secret, never an env var.
# - Non-secret Cloudflare R2 settings default to the shared R2 buckets; stack.env CLOUDFLARE_R2_* values
#   override them. The R2 access key pair stays a runtime secret.
services:
  database-migrator:
    profiles: ["migration"]
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    networks:
      - app
      - postgres
    environment:
      DOTNET_ENVIRONMENT: Production
      OpenTelemetry__ServiceName: BackendProjectTemplate.DatabaseMigrator
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DATABASE_MIGRATOR_SECRETS_GID:?DATABASE_MIGRATOR_SECRETS_GID is required}"
    volumes:
      - type: bind
        source: ${RUNTIME_SECRETS_ROOT:-/run/runtime-secrets}/${RUNTIME_SECRETS_APPLICATION:?RUNTIME_SECRETS_APPLICATION is required}/${RUNTIME_SECRETS_ENVIRONMENT:?RUNTIME_SECRETS_ENVIRONMENT is required}/database-migrator/current
        target: /run/secrets/app
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  webapi:
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    networks:
      - app
      - postgres
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Authentication__Google__Enabled: ${GOOGLE_AUTHENTICATION_ENABLED:-false}
      Authentication__Google__ClientIds__0: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__FlowLifetime: 00:10:00
      ObjectStorage__CloudflareR2__Endpoint: ${CLOUDFLARE_R2_ENDPOINT:-https://9cbea96db2a9797d2ae6ec1bc93b4149.r2.cloudflarestorage.com}
      ObjectStorage__CloudflareR2__ApplicationFolder: ${CLOUDFLARE_R2_APPLICATION_FOLDER:-BackendProjectTemplate}
      ObjectStorage__CloudflareR2__PublicBucketName: ${CLOUDFLARE_R2_PUBLIC_BUCKET_NAME:-prod-public-weur}
      ObjectStorage__CloudflareR2__PrivateBucketName: ${CLOUDFLARE_R2_PRIVATE_BUCKET_NAME:-prod-private-weur}
      ObjectStorage__CloudflareR2__PublicBaseUrl: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:-https://pub-0c671c99962543c1a440d1d9f1ce3a90.r2.dev}
      Kyc__Kycaid__Enabled: ${KYCAID_ENABLED:-false}
      Kyc__Kycaid__FormId: ${KYCAID_FORM_ID:-}
      Payments__Credo__PublicKey: ${CREDO_PUBLIC_KEY:-}
      Payments__SafeHaven__SettlementAccountNumber: ${SAFEHAVEN_SETTLEMENT_ACCOUNT_NUMBER:-}
      Payments__SafeHaven__AutoSweepAccountNumber: ${SAFEHAVEN_AUTO_SWEEP_ACCOUNT_NUMBER:-}
      Payments__SafeHaven__SettlementBankCode: ${SAFEHAVEN_SETTLEMENT_BANK_CODE:-}
      # Bachs checkout returns land on the user portal's PaymentReturn pages.
      Payments__Bachs__SuccessUrl: ${BACHS_SUCCESS_URL:-https://template-user.chidelu.com/billing/checkout/success}
      Payments__Bachs__CancelUrl: ${BACHS_CANCEL_URL:-https://template-user.chidelu.com/billing/checkout/cancelled}
      OpenTelemetry__ServiceName: BackendProjectTemplate.WebAPI
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      PYROSCOPE_PROFILING_ENABLED: "0"
      CORECLR_ENABLE_PROFILING: "0"
      Database__InitializeOnStartup: "false"
      # Caddy reaches the loopback-published port through Docker, so requests arrive from the app network
      # gateway. Trust only that address for X-Forwarded-For/Proto (see the pinned subnet below).
      ForwardedHeaders__KnownProxies__0: 172.30.231.1
      # frontendprojecttemplate-development portals network: portal server-side calls reach the API through
      # Caddy, which trusts this range and appends to X-Forwarded-For ("client, portal"). Trusting it with a
      # limit of 2 records the browser's address instead of the portal container's. 172.30.233.0/24 is the
      # frontend's pinned PORTALS_SUBNET; 172.21.0.0/16 is its old unpinned network, kept only until the
      # portals are redeployed onto the pinned one (then remove it here and in host Caddy).
      ForwardedHeaders__KnownNetworks__0: 172.30.233.0/24
      ForwardedHeaders__KnownNetworks__1: 172.21.0.0/16
      ForwardedHeaders__ForwardLimit: 2
      # Browser origins of the development frontends (DNS -> this VPS, TLS via host Caddy).
      Cors__AllowedOrigins__0: https://template-user.chidelu.com
      Cors__AllowedOrigins__1: https://template-admin.chidelu.com
      Cors__AllowedOrigins__2: https://template-marketing.chidelu.com
      # WebAuthn: credentials are scoped to chidelu.com so both sign-in frontends can use them. Only user and admin
      # authenticate with passkeys. Configuration arrays merge by index, so slot 2 must overwrite the base
      # appsettings.json localhost origin; repeating an origin is harmless (origins are de-duplicated).
      Authentication__Passkeys__RelyingPartyId: chidelu.com
      Authentication__Passkeys__AllowedOrigins__0: https://template-user.chidelu.com
      Authentication__Passkeys__AllowedOrigins__1: https://template-admin.chidelu.com
      Authentication__Passkeys__AllowedOrigins__2: https://template-user.chidelu.com
    group_add:
      - "${WEBAPI_SECRETS_GID:?WEBAPI_SECRETS_GID is required}"
    volumes:
      - type: bind
        source: ${RUNTIME_SECRETS_ROOT:-/run/runtime-secrets}/${RUNTIME_SECRETS_APPLICATION:?RUNTIME_SECRETS_APPLICATION is required}/${RUNTIME_SECRETS_ENVIRONMENT:?RUNTIME_SECRETS_ENVIRONMENT is required}/webapi/current
        target: /run/secrets/app
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Loopback only: the host reverse proxy terminates TLS and forwards here.
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  consumer:
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    networks:
      - app
      - postgres
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ObjectStorage__CloudflareR2__Endpoint: ${CLOUDFLARE_R2_ENDPOINT:-https://9cbea96db2a9797d2ae6ec1bc93b4149.r2.cloudflarestorage.com}
      ObjectStorage__CloudflareR2__ApplicationFolder: ${CLOUDFLARE_R2_APPLICATION_FOLDER:-BackendProjectTemplate}
      ObjectStorage__CloudflareR2__PublicBucketName: ${CLOUDFLARE_R2_PUBLIC_BUCKET_NAME:-prod-public-weur}
      ObjectStorage__CloudflareR2__PrivateBucketName: ${CLOUDFLARE_R2_PRIVATE_BUCKET_NAME:-prod-private-weur}
      ObjectStorage__CloudflareR2__PublicBaseUrl: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:-https://pub-0c671c99962543c1a440d1d9f1ce3a90.r2.dev}
      Messaging__RabbitMq__ServiceName: BackendProjectTemplate.Consumer
      Messaging__RabbitMq__HostName: ${RABBITMQ_HOSTNAME:-}
      Messaging__RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      Messaging__RabbitMq__VirtualHost: ${RABBITMQ_VIRTUAL_HOST:-/}
      Messaging__RabbitMq__EventsExchange: x.events.backendprojecttemplate
      Messaging__RabbitMq__CommandsExchange: x.commands.backendprojecttemplate
      OpenTelemetry__ServiceName: BackendProjectTemplate.Consumer
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      PYROSCOPE_PROFILING_ENABLED: "0"
      CORECLR_ENABLE_PROFILING: "0"
    group_add:
      - "${CONSUMER_SECRETS_GID:?CONSUMER_SECRETS_GID is required}"
    volumes:
      - type: bind
        source: ${RUNTIME_SECRETS_ROOT:-/run/runtime-secrets}/${RUNTIME_SECRETS_APPLICATION:?RUNTIME_SECRETS_APPLICATION is required}/${RUNTIME_SECRETS_ENVIRONMENT:?RUNTIME_SECRETS_ENVIRONMENT is required}/consumer/current
        target: /run/secrets/app
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  jobs:
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    networks:
      - app
      - postgres
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Messaging__RabbitMq__ServiceName: BackendProjectTemplate.Jobs
      Messaging__RabbitMq__HostName: ${RABBITMQ_HOSTNAME:-}
      Messaging__RabbitMq__Port: ${RABBITMQ_PORT:-5672}
      Messaging__RabbitMq__VirtualHost: ${RABBITMQ_VIRTUAL_HOST:-/}
      Messaging__RabbitMq__EventsExchange: x.events.backendprojecttemplate
      Messaging__RabbitMq__CommandsExchange: x.commands.backendprojecttemplate
      Kyc__Kycaid__Enabled: ${KYCAID_ENABLED:-false}
      Kyc__Kycaid__FormId: ${KYCAID_FORM_ID:-}
      Payments__Credo__PublicKey: ${CREDO_PUBLIC_KEY:-}
      Payments__SafeHaven__SettlementAccountNumber: ${SAFEHAVEN_SETTLEMENT_ACCOUNT_NUMBER:-}
      Payments__SafeHaven__AutoSweepAccountNumber: ${SAFEHAVEN_AUTO_SWEEP_ACCOUNT_NUMBER:-}
      Payments__SafeHaven__SettlementBankCode: ${SAFEHAVEN_SETTLEMENT_BANK_CODE:-}
      OpenTelemetry__ServiceName: BackendProjectTemplate.Jobs
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      PYROSCOPE_PROFILING_ENABLED: "0"
      CORECLR_ENABLE_PROFILING: "0"
    group_add:
      - "${JOBS_SECRETS_GID:?JOBS_SECRETS_GID is required}"
    volumes:
      - type: bind
        source: ${RUNTIME_SECRETS_ROOT:-/run/runtime-secrets}/${RUNTIME_SECRETS_APPLICATION:?RUNTIME_SECRETS_APPLICATION is required}/${RUNTIME_SECRETS_ENVIRONMENT:?RUNTIME_SECRETS_ENVIRONMENT is required}/jobs/current
        target: /run/secrets/app
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

networks:
  # Pinned so the gateway (172.30.231.1) that WebAPI trusts as its reverse proxy is deterministic. Docker cannot
  # change an existing network's subnet, so changing this block needs a new network name (it replaced the
  # unpinned "private" network, which the previous release still uses for restoration).
  app:
    ipam:
      config:
        - subnet: 172.30.231.0/24
          gateway: 172.30.231.1
  # Pre-created on the host (docker network create --internal shared-postgres) with pickly-postgres-1 attached.
  postgres:
    external: true
    name: shared-postgres
